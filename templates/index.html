<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>〶 Voice Time Capsule</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-image: url('/static/img/cc2.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
   


    #meter {
      width: 100%;
      height: 8px;
      background-color: #eee;
    }
    #meter-fill {
      height: 100%;
      width: 0%;
      background-color: #10b981;
      transition: width 0.1s;
    }
    #progressBar {
      transition: width 0.3s;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative z-10 text-white">



  <!-- Main content with stronger drop shadows for clarity on images -->
  <h1 class="text-3xl font-extrabold mt-12 mb-4 text-center text-white drop-shadow-xl">
    Message to the Future
  </h1>
  <p class="text-center text-blue-200 mb-6 drop-shadow font-medium">
    Send a voice message to your future self—and receive a reply from future you.<br> 
    Start a conversation across time. This is your digital time capsule.
  </p>

  <div class="mb-4 w-full max-w-lg px-4">
    <p id="status" class="text-sm text-white mb-2 font-semibold drop-shadow">
      🔴 Not recording
    </p>
    <div id="meter" class="rounded overflow-hidden mb-4">
      <div id="meter-fill"></div>
    </div>
  </div>

  <div class="flex gap-4 mb-6 w-full max-w-lg px-4">
    <button id="toggleBtn" class="w-40 text-center px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 shadow-lg">
      Start Recording
    </button>
    <button id="stopBtn" class="w-40 text-center px-4 py-2 bg-slate-500 text-white rounded hover:bg-slate-700 shadow-lg" disabled>
      Stop
    </button>
  </div>

  <form id="submitForm" class="space-y-4 w-full max-w-lg px-4" onsubmit="return false;">
    <input type="email" id="email" placeholder="Your email" required class="w-full border px-3 py-2 rounded text-black" />
    
    <label for="deliveryDate" class="block mb-1 font-small text-blue-100">Delivery date:</label>
    <input type="date" id="deliveryDate" required class="w-full border px-3 py-2 rounded text-black" />
    <div class="relative h-1 bg-blue-200 rounded overflow-hidden">
      <div id="progressBar" class="absolute top-0 left-0 h-full bg-blue-400" style="width: 0%"></div>
    </div>
    <p id="loadingStatus" class="text-sm text-blue-200 mb-2"></p>
    <button type="button" id="submitBtn" class="w-full bg-blue-700 text-white py-2 rounded hover:bg-blue-800 shadow-lg" disabled>
      📤 Submit to the Future
    </button>
  </form>

  <p class="text-center text-xs text-blue-200 mt-6 drop-shadow">
    Built by Alexis Mandario · 
    <a href="https://www.linkedin.com/in/alexis-mandario-b546881a8/" class="underline hover:text-blue-400" target="_blank" rel="noopener noreferrer">LinkedIn</a> · 
    <a href="mailto:mandarioalexis@gmail.com" class="underline hover:text-blue-400">mandarioalexis@gmail.com</a>.
  </p>

  <script src="{{ url_for('static', filename='recorder.js') }}"></script>
</body>
</html>
